<div class="container">
  <h1 class="title">
    <span style="color: #FF0000;">S</span>
    <span style="color: #FF7F00;">z</span>
    <span style="color: #FFFF00;">i</span>
    <span style="color: #00FF00;">n</span>
    <span style="color: #0000FF;">e</span>
    <span style="color: #8B00FF;">s</span>
  </h1>

  <div class="color-grid">
    <div class="color-card add-card" *ngIf="!showAddForm" (click)="toggleAddForm()">
      <div class="plus-icon">+</div>
    </div>

    <div class="color-card add-form" *ngIf="showAddForm">
      <input type="text" [(ngModel)]="newColor.name" placeholder="Color Name" class="input-field" [maxlength]="30">
      <input type="color" [(ngModel)]="newColor.hexValue" class="color-picker">
      <div class="form-buttons">
        <button class="add-btn" (click)="addColor()">ADD</button>
        <button class="cancel-btn" (click)="toggleAddForm()">CANCEL</button>
      </div>
    </div>

    <div *ngFor="let color of colors" class="color-card" [style.border-color]="color.hexValue">
      <div class="color-preview" [style.background-color]="color.hexValue"></div>
      <div class="color-info">
        <h3>{{ color.name }}</h3>
        <button class="copy-btn" (click)="copyToClipboard(color.hexValue)">
          {{ color.hexValue }}
        </button>
      </div>
      <button class="delete-btn" (click)="deleteColor(color.id)">
        <i class="bi bi-trash"></i>
      </button>
    </div>

  </div>
</div>
